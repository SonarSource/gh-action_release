name: "SonarSource LT/SQ release"
description: "Release SonarSource LT & SQ projects"
author: "Thomas Vérin & Malena Ebert"
inputs:
  publish_to_binaries:
    description: "Flag to disable the publication to binaries"
    default: 'true'
    required: false
  slack_channel:
    description: "Channel to post notifications"
    required: false
  dry_run:
    description: "Don't actually do anything, report what would have been done."
    default: 'false'
    required: false
  maven_central_sync:
    description: "If true, validate and publish the build to Maven Central as part of the release"
    default: 'false'
    required: false
  maven_central_sync_required:
    description: "If true with maven_central_sync, a Maven Central validation failure aborts and revokes the release; otherwise the release completes on Repox and binaries, and the action fails with the manual re-sync command"
    default: 'false'
    required: false
  maven_central_sync_exclusions:
    description: "Deprecated, use maven_central_sync_exclude. Glob pattern (matched against each artifact id) to exclude from the Maven Central sync"
    default: '-'
    required: false
  maven_central_sync_exclude:
    description: "Comma-separated patterns of files left out of the Maven Central sync (replaces maven_central_sync_exclusions): [group][:artifact[:classifier]][@extension] or artifactId=..:classifier=..:extension=.."
    default: '-'
    required: false
  maven_central_sync_placeholder_javadoc:
    description: "Comma-separated [groupId]:artifactId patterns of the artifacts whose Javadoc jar is replaced by a placeholder jar in the Maven Central sync"
    default: '-'
    required: false
  is_dummy_project:
    description: "If true with maven_central_sync, validate the Central bundle then drop the deployment instead of publishing"
    default: 'false'
    required: false
outputs:
  promote:
    description: "Output to detect if promote was executed"
  publish_to_binaries:
    description: "Output to detect if publish_to_binaries was executed"
  release:
    description: "Output to detect if release was revoked"
  maven_central_deployment_id:
    description: "Central deployment id after publish or drop (maven_central_sync only)"
  maven_central_sync_pending:
    description: "true if the release completed without Maven Central and still needs scripts/manual-maven-central-sync.sh"
runs:
  using: "docker"
  image: "Dockerfile"
