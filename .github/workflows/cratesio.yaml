name: Crates.io
"on":
  workflow_call:
    inputs:
      version:
        type: string
        description: Version (alternative to release event)
        required: false
      vaultAddr:
        type: string
        description: Custom Vault installation
        default: https://vault.sonar.build:8200
        required: false
      vaultTokenKey:
        type: string
        description: Vault key to read the token from
        default: crates-io
        required: false
      artifactoryRoleSuffix:
        type: string
        description: Artifactory reader suffix specified in vault repo config
        default: private-reader
        required: false
      slackChannel:
        type: string
        description: Slack channel to post notifications
        default: build
        required: false
      githubEnvironment:
        type: string
        description: GitHub Environment to set on the OIDC-using job
        required: false
      runnerLabel:
        type: string
        description: Runner label override for this job
        default: ''
        required: false

jobs:
  publish-to-cratesio:
    name: Publish to crates.io
    runs-on: ${{ inputs.runnerLabel || 'github-ubuntu-latest-s' }}
    environment: ${{ inputs.githubEnvironment }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    if: ${{ (github.event_name == 'release' && github.event.action == 'published') || inputs.version != '' }}
    steps:
      # crates.io versions are SemVer and immutable, so the build number has to come off before
      # anything is published. The accepted shapes are the ones the release action itself enforces
      # (main/release/utils/github.py): [ProjectName-]Major.Minor.Patch[-Mx][-.+]BuildNumber. Both
      # separators occur in practice — Maven projects use '1.2.3.456', Cargo projects '1.2.3-456',
      # because a dot is not legal in a crate version.
      - name: Get the version
        id: get_version
        env:
          FULL_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$FULL_VERSION" =~ ^([a-zA-Z]+-)?([0-9]+\.[0-9]+\.[0-9]+(-M[0-9]+)?)[-.+]([0-9]+)$ ]]; then
            echo "::error::'$FULL_VERSION' must follow [ProjectName-]Major.Minor.Patch[-Mx][-.+]BuildNumber"
            exit 1
          fi
          version="${BASH_REMATCH[2]}"
          build="${BASH_REMATCH[4]}"
          echo "Publishing crate version $version (build $build) from $FULL_VERSION"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Retrieve Secrets from Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@0a3114fe1230b784c35b53b099f9ab1f1e538cc7 # 3.5.0
        with:
          url: ${{ inputs.vaultAddr }}
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-${{ inputs.artifactoryRoleSuffix }} access_token | artifactory_access_token;
            development/kv/data/${{ inputs.vaultTokenKey }} token | cratesio_token;
            development/kv/data/slack webhook | slack_webhook;

      # Cargo publish re-packages from source (there is no "publish this pre-built .crate file"
      # command), so unlike the pypi/npmjs jobs there is no build artifact to download here. The
      # bytes uploaded to crates.io are therefore rebuilt, not the ones promoted through Repox.
      - name: Checkout developer repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.repository.full_name }}
          path: developer_repo
          token: ${{ github.token }}

      # A repository that pins a channel in rust-toolchain.toml needs that channel materialised
      # before cargo runs, and a caller on a minimal self-hosted runner may have no rustup at all.
      - name: Set up Rust
        working-directory: developer_repo
        run: |
          set -euo pipefail
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # Installs whatever rust-toolchain.toml pins, so the publish uses the toolchain the
          # project builds with rather than whatever the runner image happens to carry.
          rustup show
          cargo --version

      # Direct internet access to crates.io's index is not available from these runners;
      # dependency resolution is routed through Repox's cargo proxy, same as the calling
      # repo's own CI. The actual `cargo publish` target below is unaffected by this and
      # still goes to the real, public crates.io.
      #
      # Written to CARGO_HOME rather than into the checkout: a `.cargo/config.toml` inside the
      # package directory would be packaged into the published .crate unless the caller happens to
      # gitignore or exclude it, and this config must also apply to the verification build, which
      # cargo runs from target/package/.
      - name: Route crates.io dependency resolution through Repox
        run: |
          set -euo pipefail
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          cat >> "${CARGO_HOME:-$HOME/.cargo}/config.toml" <<'EOF'

          # Added by SonarSource/gh-action_release cratesio.yaml
          [registry]
          global-credential-providers = ["cargo:token"]

          [registries.repox]
          index = "sparse+https://repox.jfrog.io/artifactory/api/cargo/crates-io/index/"

          [source.crates-io]
          replace-with = "repox"
          EOF

      # Cargo has no flag for "publish as this version", so the manifest is edited in place.
      # Cargo.lock records the package's own version too, and `--locked` compares the two, so both
      # files move together — the same reason the calling repo's build stamps both.
      - name: Set the crate version
        working-directory: developer_repo
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          # Assumes a single-crate repository with one top-level [package] section.
          crate=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -z "$crate" ]]; then
            echo "::error::Cargo.toml declares no package name"
            exit 1
          fi
          awk -v v="$VERSION" '!done && /^version *= */{print "version = \"" v "\""; done=1; next} {print}' \
            Cargo.toml > Cargo.toml.stamped && mv Cargo.toml.stamped Cargo.toml
          # Never take the stamp on trust. If the pattern missed — an unusual manifest layout, or a
          # first `version =` that is not the package's — cargo would happily publish the source
          # version instead, and a crates.io release cannot be taken back.
          stamped=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$stamped" != "$VERSION" ]]; then
            echo "::error::Failed to stamp version $VERSION into Cargo.toml (found '${stamped:-none}')"
            exit 1
          fi
          if [[ -f Cargo.lock ]]; then
            awk -v n="$crate" -v v="$VERSION" \
              '$0 == "name = \"" n "\"" {print; getline; print "version = \"" v "\""; next} {print}' \
              Cargo.lock > Cargo.lock.stamped && mv Cargo.lock.stamped Cargo.lock
            echo "LOCKED=--locked" >> "$GITHUB_ENV"
          else
            echo "::warning::No Cargo.lock; publishing without --locked"
            echo "LOCKED=" >> "$GITHUB_ENV"
          fi
          echo "Publishing $crate $(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"

      # The build number is stripped from the crate version above, but the artifacts a release
      # publishes elsewhere — Repox, binaries.sonarsource.com — are all named `<version>-<build>`.
      # Anything in the manifest that has to name one of those files therefore cannot be written in
      # terms of the crate version alone. `[package.metadata.binstall]` is the case that motivated
      # this: `cargo binstall` templates `{ version }` from crates.io, so a `pkg-url` built only
      # from it points at a path that does not exist.
      #
      # `{ build }` closes the gap. The manifest in the repository keeps a template, and the
      # manifest inside the published `.crate` — which is what `cargo binstall` reads — carries the
      # build number of the release it belongs to. The spelling deliberately matches binstall's own
      # `{ version }` so the two read alike side by side.
      #
      # Substituted across the whole file rather than within a section, because `[package.metadata]`
      # cannot be delimited reliably in sed and `{ build }` means nothing to Cargo anywhere else. A
      # manifest that never uses it is left byte-for-byte alone.
      - name: Substitute the build number
        working-directory: developer_repo
        env:
          BUILD: ${{ steps.get_version.outputs.build }}
        run: |
          set -euo pipefail
          placeholder='\{[[:space:]]*build[[:space:]]*\}'
          occurrences=$(grep -c -E "$placeholder" Cargo.toml || true)
          if [[ "$occurrences" -eq 0 ]]; then
            echo "No { build } placeholder in Cargo.toml; nothing to substitute"
            exit 0
          fi
          sed -E "s/$placeholder/${BUILD}/g" Cargo.toml > Cargo.toml.build && mv Cargo.toml.build Cargo.toml
          # Same reasoning as the version stamp: a placeholder that survives into a published crate
          # cannot be taken back, and `cargo binstall` would fail on it for every user.
          if grep -q -E "$placeholder" Cargo.toml; then
            echo "::error::{ build } survived substitution in Cargo.toml"
            exit 1
          fi
          echo "Substituted { build } -> ${BUILD} on ${occurrences} line(s):"
          grep -n -F "${BUILD}" Cargo.toml || true

      # A crates.io version can only be uploaded once, so this job is not idempotent by itself. The
      # release flow is built on "fix the root cause and re-run the failed workflow", and a re-run
      # after a failure *downstream* of a successful upload would otherwise die here on "crate version
      # already uploaded" and could never complete. Treat an already-published version as done.
      - name: Check whether the version is already on crates.io
        id: already_published
        working-directory: developer_repo
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          # Only 404 is a definitive "not published". crates.io rate-limits its REST API, so a 429,
          # a 5xx or a proxy error must not be read as "absent" in silence — bounded and retried,
          # then reported, because publishing anyway is the safe default but the operator needs to
          # know the check was inconclusive if cargo then rejects the upload as a duplicate.
          code=$(curl -sS --max-time 30 --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            -A "SonarSource gh-action_release (https://github.com/SonarSource/gh-action_release)" \
            "https://crates.io/api/v1/crates/${crate}/${VERSION}") || code=000
          case "$code" in
            200)
              echo "::notice::${crate} ${VERSION} is already on crates.io; skipping the publish"
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::crates.io returned HTTP ${code}; cannot tell whether ${crate} ${VERSION} exists, attempting the publish"
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # --allow-dirty: the version stamp above is an uncommitted edit, which cargo otherwise refuses
      # to publish. --registry crates-io: with crates-io replaced above, cargo will not pick a
      # publish target on its own unless package.publish names exactly one registry.
      #
      # The dry run first, against the same working tree and the same flags: it packages the crate
      # and compiles it in isolation, so a bad version, a missing manifest field or a file that does
      # not build on its own fails before the upload rather than after it. It costs a second
      # verification build, which is worth it for the one step here that cannot be undone.
      - name: Publish to crates.io
        if: ${{ steps.already_published.outputs.skip != 'true' }}
        working-directory: developer_repo
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).artifactory_access_token }}
          CARGO_REGISTRY_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).cratesio_token }}
        run: |
          set -euo pipefail
          cargo publish ${LOCKED} --allow-dirty --registry crates-io --dry-run
          cargo publish ${LOCKED} --allow-dirty --registry crates-io

      # The `outputs.vault != ''` guard covers a failure before or in the Vault step itself, when
      # there is no webhook to post to; the job still fails via "Exit with Error" below.
      - name: Notify on Failure
        if: ${{ failure() && steps.secrets.outputs.vault != '' }}
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ fromJSON(steps.secrets.outputs.vault || '{}').slack_webhook }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "${{ inputs.slackChannel }}",
              "attachments": [
                {
                  "color": "#ff0000",
                  "text": "crates.io publish failed in `${{ github.repository }}` (event: `${{ github.event_name }}`, triggered by `${{ github.actor }}`).\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                }
              ]
            }

      - name: Exit with Error
        if: ${{ failure() }}
        run: exit 1
