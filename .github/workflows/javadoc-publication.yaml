# yamllint disable rule:line-length
---
name: Javadoc publication
"on":
  workflow_call:
    inputs:
      version:
        type: string
        description: Version (alternative to release event)
        required: false
      dryRun:
        type: boolean
        description: Flag to enable the dry-run execution
        default: false
        required: false
      javadocDestinationDirectory:
        type: string
        description: Name of the directory to use at https://javadocs.sonarsource.org/ (if not provided, use repository name)
        required: false
      vaultAddr:
        type: string
        description: Custom vault installation
        default: https://vault.sonar.build:8200
        required: false
      artifactoryRoleSuffix:
        type: string
        description: Artifactory reader suffix specified in vault repo config
        default: private-reader
        required: false
      publicRelease:
        type: boolean
        description: For a mixed-privacy release (both org.sonarsource.* and com.sonarsource.* javadoc exist), also publish the private half; ignored otherwise -- a single-privacy build's javadoc is always published
        default: false
        required: false
      githubEnvironment:
        type: string
        description: GitHub Environment to set on the OIDC-using job
        required: false
      runnerLabel:
        type: string
        description: Runner label override for this job
        default: ''
        required: false

jobs:
  javadoc-publication:
    name: Publish javadoc
    runs-on: ${{ inputs.runnerLabel || 'github-ubuntu-latest-s' }}
    environment: ${{ inputs.githubEnvironment }}
    permissions:
      id-token: write  # to authenticate via OIDC
      contents: read  # to revert a github release
    timeout-minutes: 5
    if: ${{ (github.event_name == 'release' && github.event.action == 'published') || inputs.version != '' }}
    outputs:
      javadoc-publication: ${{ steps.upload-latest.outcome }}
    steps:
      - name: Checkout gh-action_release for scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: 7549bbe53e69c555767eae251e247e3a183a9a6d
          path: gh-action_release
      - name: Get the version
        id: get_version
        run: |
          IFS=. read -r major minor patch build <<< "${{ inputs.version || github.event.release.tag_name }}"
          echo "build=${build}" >> $GITHUB_OUTPUT
          echo "patch=${patch}" >> $GITHUB_OUTPUT
          echo "minor=${minor}" >> $GITHUB_OUTPUT
          echo "major=${major}" >> $GITHUB_OUTPUT
      - name: Create local repository directories
        id: local_repo
        run: |
          echo "dir=$(mktemp -d repo.XXXXXXXX)" >> $GITHUB_OUTPUT
          echo "public_dir=$(mktemp -d repo-public.XXXXXXXX)" >> $GITHUB_OUTPUT
          echo "private_dir=$(mktemp -d repo-private.XXXXXXXX)" >> $GITHUB_OUTPUT
      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@0a3114fe1230b784c35b53b099f9ab1f1e538cc7 # 3.5.0
        with:
          url: ${{ inputs.vaultAddr }}
          secrets:
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-${{ inputs.artifactoryRoleSuffix }} access_token  | artifactory_access_token;
            development/kv/data/slack webhook | slack_webhook;
            development/aws/sts/javadocs access_key | javadoc_aws_access_key_id;
            development/aws/sts/javadocs secret_key | javadoc_aws_secret_access_key;
            development/aws/sts/javadocs security_token | javadoc_aws_security_token;
      - name: Setup JFrog
        uses: SonarSource/jfrog-setup-wrapper@b243f5b25440cdcb062db329eec5fd9c9cd2dab2 # 3.7.0
        with:
          jfrogAccessToken: ${{ fromJSON(steps.secrets.outputs.vault).artifactory_access_token }}
      - name: Download public javadoc (org.sonarsource.*)
        uses: SonarSource/gh-action_release/download-build@7549bbe53e69c555767eae251e247e3a183a9a6d
        with:
          flat-download: true
          fail-no-op: false
          build-number: ${{ steps.get_version.outputs.build }}
          local-repo-dir: ${{ steps.local_repo.outputs.public_dir }}
          filter: org/sonarsource
          remote-repo: sonarsource-public-releases
      - name: Download private javadoc (com.sonarsource.*)
        uses: SonarSource/gh-action_release/download-build@7549bbe53e69c555767eae251e247e3a183a9a6d
        with:
          flat-download: true
          fail-no-op: false
          build-number: ${{ steps.get_version.outputs.build }}
          local-repo-dir: ${{ steps.local_repo.outputs.private_dir }}
          filter: com/sonarsource
          remote-repo: sonarsource-private-releases
      - name: Keep only javadoc.jar
        run: |
          find ${{ steps.local_repo.outputs.public_dir }} -type f ! -name "*-javadoc.jar" -delete
          find ${{ steps.local_repo.outputs.private_dir }} -type f ! -name "*-javadoc.jar" -delete
      - name: Select javadoc to publish
        id: select
        run: |
          ./gh-action_release/scripts/select-javadoc.sh "${{ steps.local_repo.outputs.public_dir }}" "${{ steps.local_repo.outputs.private_dir }}" "${{ steps.local_repo.outputs.dir }}" "${{ inputs.publicRelease }}"
      - name: List artifacts
        run: ls ${{ steps.local_repo.outputs.dir }}
      - name: Extract javadoc.jar
        run: ./gh-action_release/scripts/extract-javadoc.sh "${{ steps.local_repo.outputs.dir }}" "${{ inputs.version || github.event.release.tag_name }}" "${{ steps.select.outputs.mixed }}"
      - name: List javadoc files
        run: ls "${{ steps.local_repo.outputs.dir }}/javadoc/${{ inputs.version || github.event.release.tag_name }}"
      - name: Publish javadoc files to S3
        uses: SonarSource/gh-action_release/aws-s3@05db046385edc88eb40554c2677c1d726f4987f6 # master
        with:
          command: cp
          flags: --recursive
          source: ${{ steps.local_repo.outputs.dir }}/javadoc
          destination: s3://javadocs-cdn-eu-central-1-prod/${{ inputs.javadocDestinationDirectory || github.event.repository.name }}
          aws_access_key_id: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_access_key_id }}
          aws_secret_access_key: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_secret_access_key }}
          aws_session_token: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_security_token }}
          aws_region: eu-central-1
      - name: Delete dir named latest in S3
        uses: SonarSource/gh-action_release/aws-s3@05db046385edc88eb40554c2677c1d726f4987f6 # master
        with:
          command: rm
          source: s3://javadocs-cdn-eu-central-1-prod/${{ inputs.javadocDestinationDirectory || github.event.repository.name }}/latest
          aws_access_key_id: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_access_key_id }}
          aws_secret_access_key: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_secret_access_key }}
          aws_session_token: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_security_token }}
          aws_region: eu-central-1
        continue-on-error: true # the first time a project publish javadoc, there is no latest dir available
      - name: Upload to dir named latest in S3
        id: upload-latest
        uses: SonarSource/gh-action_release/aws-s3@05db046385edc88eb40554c2677c1d726f4987f6 # master
        with:
          command: cp
          flags: --recursive
          source: ${{ steps.local_repo.outputs.dir }}/javadoc/${{ inputs.version || github.event.release.tag_name }}/
          destination: s3://javadocs-cdn-eu-central-1-prod/${{ inputs.javadocDestinationDirectory || github.event.repository.name }}/latest
          aws_access_key_id: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_access_key_id }}
          aws_secret_access_key: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_secret_access_key }}
          aws_session_token: ${{ fromJSON(steps.secrets.outputs.vault).javadoc_aws_security_token }}
          aws_region: eu-central-1
