name: Test Javadoc Extraction Logic

on:
  pull_request:
    paths:
      - 'scripts/extract-javadoc.sh'
      - 'scripts/select-javadoc.sh'
      - 'spec/extract_javadoc_spec.sh'
      - 'spec/select_javadoc_spec.sh'
      - '.github/workflows/javadoc-publication.yaml'
      - 'mise.toml'

jobs:
  test:
    name: Test Javadoc Script
    runs-on: github-ubuntu-latest-s

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install tools with mise
        uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7 # v4.2.4
        with:
          version: 2026.2.3
          install: true
          cache: true

      - name: Run tests
        run: mise exec -- shellspec --format documentation
