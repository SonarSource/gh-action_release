name: Test Javadoc Extraction Logic

on:
  pull_request:
    paths:
      - 'scripts/extract-javadoc.sh'
      - 'scripts/select-javadoc.sh'
      - 'spec/extract_javadoc_spec.sh'
      - 'spec/select_javadoc_spec.sh'
      - '.github/workflows/javadoc-publication.yaml'
      - 'mise.toml'

jobs:
  test:
    name: Test Javadoc Script
    runs-on: github-ubuntu-latest-s

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools with mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.2.3
          install: true
          cache: true

      - name: Run tests
        run: mise exec -- shellspec --format documentation
